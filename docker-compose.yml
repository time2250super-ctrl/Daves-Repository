services:
  lora:
    build:
      context: .
      dockerfile: Dockerfile.lora
    image: local-ai-lora:latest
    working_dir: /workspace
    mem_limit: 8g
    memswap_limit: 10g
    cpus: 2.0
    shm_size: "256mb"
    volumes:
      - ./:/workspace
      - hf-cache:/workspace/.cache/huggingface
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      MODEL_ID: ${MODEL_ID:-Qwen/Qwen2.5-1.5B-Instruct}
      DATA_PATH: ${DATA_PATH:-/workspace/data/train.jsonl}
      OUTPUT_DIR: ${OUTPUT_DIR:-/workspace/output/lora}
      MAX_SEQ_LEN: ${MAX_SEQ_LEN:-256}
      EPOCHS: ${EPOCHS:-1}
      LR: ${LR:-2e-4}
      BATCH_SIZE: ${BATCH_SIZE:-1}
      GRAD_ACCUM: ${GRAD_ACCUM:-2}
      LORA_R: ${LORA_R:-8}
      ASSISTANT_NAME: ${ASSISTANT_NAME:-Nova}
      SYSTEM_PROMPT: ${SYSTEM_PROMPT:-}

  voice:
    build:
      context: .
      dockerfile: Dockerfile
    image: local-ai-voice:latest
    working_dir: /workspace
    mem_limit: 8g
    memswap_limit: 10g
    cpus: 2.0
    shm_size: "256mb"
    ports:
      - "7860:7860"
    volumes:
      - ./:/workspace
      - hf-cache:/workspace/.cache/huggingface
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      MODEL_ID: ${MODEL_ID:-Qwen/Qwen2.5-1.5B-Instruct}
      ADAPTER_DIR: ${ADAPTER_DIR:-/workspace/output/lora}
      MAX_NEW_TOKENS: ${MAX_NEW_TOKENS:-96}
      ASSISTANT_NAME: ${ASSISTANT_NAME:-Nova}
      SYSTEM_PROMPT: ${SYSTEM_PROMPT:-}
      BROWSER_VOICE_HINT: ${BROWSER_VOICE_HINT:-female}
      PORT: "7860"
    entrypoint: ["python", "serve.py"]

  infer:
    image: local-ai-voice:latest
    working_dir: /workspace
    mem_limit: 8g
    memswap_limit: 10g
    cpus: 2.0
    shm_size: "256mb"
    volumes:
      - ./:/workspace
      - hf-cache:/workspace/.cache/huggingface
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      MODEL_ID: ${MODEL_ID:-Qwen/Qwen2.5-1.5B-Instruct}
      ADAPTER_DIR: ${ADAPTER_DIR:-/workspace/output/lora}
      MAX_NEW_TOKENS: ${MAX_NEW_TOKENS:-128}
      ASSISTANT_NAME: ${ASSISTANT_NAME:-Nova}
      SYSTEM_PROMPT: ${SYSTEM_PROMPT:-}
    stdin_open: true
    tty: true
    entrypoint: ["python", "infer.py"]

volumes:
  hf-cache:
