<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nova — voice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg0: #0f1412;
      --bg1: #1a2420;
      --ink: #e8f0ea;
      --muted: #9bb0a3;
      --accent: #c4a35a;
      --listen: #3d8f6e;
      --danger: #c46b5a;
      --line: rgba(232, 240, 234, 0.12);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(1200px 700px at 15% -10%, #24352d 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 20%, #2a2214 0%, transparent 50%),
        var(--bg0);
      color: var(--ink);
      font-family: "IBM Plex Sans", system-ui, sans-serif;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 20px 80px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }
    .brand {
      font-family: "Fraunces", Georgia, serif;
      font-size: clamp(2.6rem, 8vw, 4.2rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 0.95;
      margin: 0;
    }
    .tag {
      color: var(--muted);
      font-size: 1.05rem;
      max-width: 34ch;
      line-height: 1.45;
      margin: 8px 0 0;
    }
    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
      border-top: 1px solid var(--line);
      padding-top: 22px;
      min-height: 280px;
    }
    .bubble {
      max-width: 92%;
      padding: 12px 14px;
      border-radius: 14px;
      line-height: 1.45;
      white-space: pre-wrap;
    }
    .bubble.you {
      align-self: flex-end;
      background: rgba(196, 163, 90, 0.16);
      border: 1px solid rgba(196, 163, 90, 0.35);
    }
    .bubble.her {
      align-self: flex-start;
      background: rgba(61, 143, 110, 0.14);
      border: 1px solid rgba(61, 143, 110, 0.35);
    }
    .meta {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .dock {
      position: sticky;
      bottom: 0;
      display: grid;
      gap: 12px;
      padding: 16px 0 0;
      background: linear-gradient(transparent, var(--bg0) 30%);
    }
    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    button, .status {
      font: inherit;
    }
    button {
      border: 1px solid var(--line);
      background: var(--bg1);
      color: var(--ink);
      border-radius: 999px;
      padding: 12px 18px;
      cursor: pointer;
    }
    button.primary {
      background: var(--listen);
      border-color: transparent;
      color: #f4fff8;
      font-weight: 600;
    }
    button.primary.hot {
      background: var(--danger);
    }
    button:disabled { opacity: 0.45; cursor: wait; }
    input[type="text"] {
      flex: 1;
      min-width: 180px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.03);
      color: var(--ink);
      padding: 12px 16px;
      font: inherit;
    }
    .status {
      color: var(--muted);
      font-size: 0.9rem;
    }
    .hint {
      color: var(--muted);
      font-size: 0.82rem;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1 class="brand" id="name">Nova</h1>
      <p class="tag">Talk into your mic. She answers through your speakers. Turns you like can be saved into her next LoRA train.</p>
    </header>

    <section class="stage" id="log" aria-live="polite"></section>

    <div class="dock">
      <div class="row">
        <button class="primary" id="micBtn" type="button">Hold to talk</button>
        <button id="teachBtn" type="button" disabled>Teach this turn</button>
        <button id="resetBtn" type="button">Reset</button>
        <span class="status" id="status">Loading persona…</span>
      </div>
      <div class="row">
        <input id="textIn" type="text" placeholder="Or type, then Enter" autocomplete="off" />
        <button id="sendBtn" type="button">Send</button>
      </div>
      <p class="hint">Uses your browser mic + speech synthesis. Allow microphone when asked. Chrome/Edge work best.</p>
    </div>
  </div>

  <script>
    const logEl = document.getElementById("log");
    const statusEl = document.getElementById("status");
    const micBtn = document.getElementById("micBtn");
    const teachBtn = document.getElementById("teachBtn");
    const resetBtn = document.getElementById("resetBtn");
    const textIn = document.getElementById("textIn");
    const sendBtn = document.getElementById("sendBtn");
    const nameEl = document.getElementById("name");

    let persona = { name: "Nova", voice_hint: "female" };
    let lastTurn = null;
    let busy = false;
    let recognizing = false;
    let chosenVoice = null;

    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = SpeechRec ? new SpeechRec() : null;
    if (recognition) {
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.lang = "en-US";
    }

    function setStatus(t) { statusEl.textContent = t; }

    function addBubble(who, text) {
      const wrap = document.createElement("div");
      wrap.className = "bubble " + (who === "you" ? "you" : "her");
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = who === "you" ? "You" : persona.name;
      const body = document.createElement("div");
      body.textContent = text;
      wrap.appendChild(meta);
      wrap.appendChild(body);
      logEl.appendChild(wrap);
      wrap.scrollIntoView({ behavior: "smooth", block: "end" });
    }

    function pickVoice() {
      const voices = speechSynthesis.getVoices();
      if (!voices.length) return null;
      const hint = (persona.voice_hint || "female").toLowerCase();
      const prefer = voices.find(v =>
        /aria|jenny|sara|zira|female|samantha|linda|susan|hazel/i.test(v.name)
      ) || voices.find(v => hint === "female" && /female/i.test(v.name))
        || voices.find(v => /en(-|_)?us/i.test(v.lang))
        || voices[0];
      return prefer;
    }

    function speak(text) {
      if (!window.speechSynthesis) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      chosenVoice = chosenVoice || pickVoice();
      if (chosenVoice) u.voice = chosenVoice;
      u.rate = 1.02;
      u.pitch = 1.05;
      speechSynthesis.speak(u);
    }

    async function boot() {
      try {
        const res = await fetch("/api/persona");
        persona = await res.json();
        nameEl.textContent = persona.name;
        document.title = persona.name + " — voice";
        setStatus(recognition ? "Ready. Press and hold to talk." : "Mic unsupported here — type instead.");
      } catch (e) {
        setStatus("Could not reach server.");
      }
      speechSynthesis.onvoiceschanged = () => { chosenVoice = pickVoice(); };
      chosenVoice = pickVoice();
    }

    async function send(text, source) {
      if (!text || busy) return;
      busy = true;
      teachBtn.disabled = true;
      setStatus(persona.name + " is thinking…");
      addBubble("you", text);
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text, source }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "chat failed");
        addBubble("her", data.reply);
        speak(data.reply);
        lastTurn = { user: text, assistant: data.reply };
        teachBtn.disabled = false;
        setStatus("Ready.");
      } catch (e) {
        setStatus(String(e.message || e));
      } finally {
        busy = false;
      }
    }

    sendBtn.onclick = () => {
      const t = textIn.value.trim();
      textIn.value = "";
      send(t, "text");
    };
    textIn.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        sendBtn.click();
      }
    });

    teachBtn.onclick = async () => {
      if (!lastTurn) return;
      teachBtn.disabled = true;
      const res = await fetch("/api/teach", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(lastTurn),
      });
      setStatus(res.ok ? "Saved into data/train.jsonl for next LoRA run." : "Teach failed.");
    };

    resetBtn.onclick = async () => {
      await fetch("/api/reset", { method: "POST" });
      logEl.innerHTML = "";
      lastTurn = null;
      teachBtn.disabled = true;
      speechSynthesis.cancel();
      setStatus("Memory cleared.");
    };

    function startListen() {
      if (!recognition || busy || recognizing) return;
      recognizing = true;
      micBtn.classList.add("hot");
      micBtn.textContent = "Listening…";
      setStatus("Listening — release to send.");
      let finalText = "";
      recognition.onresult = (ev) => {
        let interim = "";
        for (let i = ev.resultIndex; i < ev.results.length; i++) {
          const t = ev.results[i][0].transcript;
          if (ev.results[i].isFinal) finalText += t;
          else interim += t;
        }
        setStatus((finalText || interim || "…").trim());
      };
      recognition.onerror = () => {
        recognizing = false;
        micBtn.classList.remove("hot");
        micBtn.textContent = "Hold to talk";
        setStatus("Mic error — try again or type.");
      };
      recognition.onend = () => {
        recognizing = false;
        micBtn.classList.remove("hot");
        micBtn.textContent = "Hold to talk";
        const said = finalText.trim();
        if (said) send(said, "voice");
        else setStatus("Ready.");
      };
      recognition.start();
    }

    function stopListen() {
      if (recognition && recognizing) recognition.stop();
    }

    micBtn.addEventListener("mousedown", startListen);
    micBtn.addEventListener("mouseup", stopListen);
    micBtn.addEventListener("mouseleave", stopListen);
    micBtn.addEventListener("touchstart", (e) => { e.preventDefault(); startListen(); });
    micBtn.addEventListener("touchend", (e) => { e.preventDefault(); stopListen(); });

    if (!recognition) micBtn.disabled = true;
    boot();
  </script>
</body>
</html>
